# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

# Questa configurazione indica che il flusso di lavoro verrà eseguito solo quando viene effettuato un push o viene aperta una pull request sul branch master. 
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Con questa modifica, il flusso di lavoro verrà attivato solo per gli eventi push e pull_request su master e non su develop.
# on:
#   push:
#     branches:
#       - master
#   pull_request:
#     branches:
#       - master

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
        restore-keys: |
          nuget-${{ runner.os }}-
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore -c Release
    - name: Test
      run: dotnet test --no-build -c Release --verbosity normal
    - name: Landlock sandbox integration probe
      run: |
        HINA="$(find Hina.CLI/bin/Release -type f -name Hina.CLI | head -1)"
        if [ -z "$HINA" ]; then echo "hina binary not found" >&2; exit 1; fi
        echo "Using hina: $HINA (kernel $(uname -r))"
        chmod +x scripts/landlock-probe.sh
        bash scripts/landlock-probe.sh "$HINA"
    - name: Landlock network sandbox probe
      run: |
        HINA="$(find Hina.CLI/bin/Release -type f -name Hina.CLI | head -1)"
        if [ -z "$HINA" ]; then echo "hina binary not found" >&2; exit 1; fi
        echo "Using hina: $HINA (kernel $(uname -r))"
        chmod +x scripts/landlock-net-probe.sh
        bash scripts/landlock-net-probe.sh "$HINA"

  macos-sandbox:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
        restore-keys: |
          nuget-${{ runner.os }}-
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore -c Release
    # The macOS sandbox-exec backend is enforced here: MacOsSandboxTests runs a real
    # sandbox-exec child and asserts an ungranted read is denied + a granted write
    # allowed. It is a no-op assert off macOS, so this job is its real proof.
    - name: Test (incl. sandbox-exec enforcement)
      run: dotnet test --no-build -c Release --verbosity normal

  windows-sandbox:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
        restore-keys: |
          nuget-${{ runner.os }}-
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore -c Release
    - name: Test
      run: dotnet test --no-build -c Release --verbosity normal
    # The Windows AppContainer backend can only be PROVEN on a real Windows runner.
    # windows-sandbox-probe.ps1 runs a child under an AppContainer granting only a
    # docs:rw dir (not a secret dir) and asserts the secret read is denied + the docs
    # write allowed. It skip-passes if AppContainer is unavailable.
    - name: Windows AppContainer sandbox probe
      shell: pwsh
      run: |
        $hina = Get-ChildItem -Path Hina.CLI/bin/Release -Recurse -Filter Hina.CLI.exe | Select-Object -First 1
        if (-not $hina) { Write-Error "hina binary not found"; exit 1 }
        Write-Host "Using hina: $($hina.FullName)"
        ./scripts/windows-sandbox-probe.ps1 -HinaExe $hina.FullName
