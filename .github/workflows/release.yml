name: Release

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --verbosity normal

  # Hina.CLI is NativeAOT — must build on the matching host OS family.
  # Hina.Builder / Hina.Host are plain self-contained and cross-compile from any host.
  build-cli:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # macOS NativeAOT links against system OpenSSL + Brotli, both supplied by Homebrew.
      - name: Install brew libs for macOS AOT
        if: matrix.os == 'macos-latest'
        run: brew install openssl@3 brotli

      # linux-arm64 cross-compile from x64 needs the cross-arch sysroot package.
      - name: Install linux-arm64 cross toolchain
        if: matrix.rid == 'linux-arm64'
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs) main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs)-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          sudo apt-get update
          sudo apt-get install -y clang llvm binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu zlib1g-dev:arm64

      - name: Publish Hina.CLI (${{ matrix.rid }}, AOT)
        run: dotnet publish Hina.CLI/Hina.CLI.csproj -c Release -r ${{ matrix.rid }} --self-contained -o artifacts/cli

      - name: Package Hina.CLI archive
        shell: bash
        run: |
          set -e
          mkdir -p dist
          base="Hina.CLI-${{ matrix.rid }}"
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            (cd artifacts/cli && 7z a -tzip "../../dist/$base.zip" . > /dev/null)
          else
            tar -C artifacts/cli -czf "dist/$base.tar.gz" .
          fi
          ls -la dist

      - name: Upload Hina.CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: hina-cli-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  build-builder-host:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Hina.Builder (${{ matrix.rid }})
        run: dotnet publish Hina.Builder/Hina.Builder.csproj -c Release -r ${{ matrix.rid }} --self-contained -o artifacts/builder
      - name: Publish Hina.Host (${{ matrix.rid }})
        run: dotnet publish Hina.Host/Hina.Host.csproj -c Release -r ${{ matrix.rid }} --self-contained -o artifacts/host

      - name: Package archives
        run: |
          set -e
          mkdir -p dist
          for project in builder host; do
            case "$project" in
              builder) name=Hina.Builder ;;
              host) name=Hina.Host ;;
            esac
            base="$name-${{ matrix.rid }}"
            if [[ "${{ matrix.rid }}" == win-* ]]; then
              (cd artifacts/$project && zip -r "../../dist/$base.zip" .)
            else
              tar -C artifacts/$project -czf "dist/$base.tar.gz" .
            fi
          done
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hina-builder-host-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build-cli, build-builder-host]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Generate version tag
        id: version
        run: |
          TAG="v1.0.0-$(git rev-parse --short HEAD)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Generated tag: $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Hina ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
