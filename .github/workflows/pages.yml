name: Pages

# Deploy the static landing page in website/ to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source = "GitHub Actions",
# and a DNS CNAME record (hina -> arutosio.github.io) for the custom domain
# declared in website/CNAME.
on:
  push:
    branches: [ master ]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
